# Pin functions of 2.13inch-socket's EPM_FPC1, by pad number: the keyboard end of the 2.13inch e-paper module's FFC
# (JUSHUO AFD01-S10FCA-00, 10P 0.5 mm; it meets the module's EP_FPC2 pin k to pin k). Panel: GDEY0213B74 (SSD1680,
# 4-wire SPI with BS1 to GND); LED: the module's WS2812B-Mini-V6.
# For whatever assigns the MCU pins to these signals (kbplacer) and writes the ZMK pin config (shield
# epaper_gdey0213b74 in zmk-ergo-cai; the pins themselves in zmk-config). KicadGen puts it into the project next to
# 2.13inch-socket.kicad_sch; kbplacer finds it from the sheet file of the socket's footprints.
# - zmk: the ZMK shield of this module and the west project that has it, for the zmk-config kbplacer writes after
#   routing (build.yaml, west.yml; the pins below go under #ifdef SHIELD_EPAPER_GDEY0213B74).
# - pins: by EPM_FPC1 pad, the net, what it does, and its direction seen from the MCU (out, in, power).
# - signals: what each signal needs of its MCU pin; kbplacer's SignalAssignor reads this.
#   needs: fast   switches faster than the nRF52840's low-frequency pins allow (10 kHz, standard drive): an SPI
#                 clock or data line, the LED's 800 kbit/s data;
#          any    any GPIO;
#          analog an AIN pin.
#   zmk: where the pin goes in the shield's devicetree; kbplacer writes it into zmk-config's config/<half>.overlay
#        (for now the nRF52840 DK's pins are set by hand in config/epaper_gdey0213b74.dtsi).
#        {pinctrl: [nodes], psel: F}       NRF_PSEL(F, port, pin) in group1 of each pinctrl node
#        {node: label, gpios: prop, flags} prop = <&gpio<port> <pin> flags>
#        The LED has an SPI of its own (spi3, led-strip epaper_led, worldsemi,ws2812-spi), so its pin can be on
#        either port; Zephyr's ws2812-gpio would drive P0 pins only. The layer colours are layer_led's colors.
zmk:
  shield: epaper_gdey0213b74
  module: {name: zmk-ergo-cai, url: https://github.com/shiqi-614/zmk-ergo-cai, revision: main}
footprint: EPM_FPC1
connector: JUSHUO AFD01-S10FCA-00
pins:
  "1": {net: GND}
  "2": {net: GPIO_DIN, function: "data in of the module's WS2812B-Mini-V6 status LED (WS2812 timing, 800 kbit/s)", dir: out}
  "3": {net: EP_BUSY, function: "panel BUSY: high while the panel is busy", dir: in}
  "4": {net: EP_RST, function: "panel RES#: reset, active low", dir: out}
  "5": {net: EP_DC, function: "panel D/C#: data high, command low", dir: out}
  "6": {net: EP_CS, function: "panel CS#: SPI chip select, active low", dir: out}
  "7": {net: EP_CLK, function: "panel SCL: SPI clock", dir: out}
  "8": {net: EP_DIN, function: "panel SDA: SPI data to the panel (MOSI)", dir: out}
  "9": {net: 3.3V, function: "supply of the panel and the LED", dir: power}
  "10": {net: GND}
  "11": {net: GND, function: "mounting pad"}
  "12": {net: GND, function: "mounting pad"}
signals:
  EP_CLK: {needs: fast, zmk: {pinctrl: [spi2_default, spi2_sleep], psel: SPIM_SCK}}
  EP_DIN: {needs: fast, zmk: {pinctrl: [spi2_default, spi2_sleep], psel: SPIM_MOSI}}
  EP_CS: {needs: any, zmk: {node: epaper_spi, gpios: cs-gpios, flags: GPIO_ACTIVE_LOW}}
  EP_DC: {needs: any, zmk: {node: mipi_dbi_epaper, gpios: dc-gpios, flags: GPIO_ACTIVE_HIGH}}
  EP_RST: {needs: any, zmk: {node: mipi_dbi_epaper, gpios: reset-gpios, flags: GPIO_ACTIVE_LOW}}
  EP_BUSY: {needs: any, zmk: {node: ssd16xx_waveshare_epaper_gdey0213b74, gpios: busy-gpios, flags: GPIO_ACTIVE_HIGH}}
  GPIO_DIN: {needs: fast, zmk: {pinctrl: [epaper_led_default, epaper_led_sleep], psel: SPIM_MOSI}}
