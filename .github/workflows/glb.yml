# Exports the modules' 3D models again and commits the ones that changed. A module has one when its .glb is committed
# beside its .kicad_pcb (e-paper/2.13inch/2.13inch.glb), and ergogen-gui's 3D view draws it (assemblies.<half>.parts
# in ErgoCai's config). tools/export_glb.py does the export; any file of the right name opts a new module in.
# Runs:
# - when a board, a .glb, the script or this file changes on main;
# - every day, for ErgoCaiLib's models, which go into the files too;
# - by hand (Actions > glb > Run workflow).
# Its own commits don't start it again: pushes made with the workflow's token start no workflows.
name: glb

on:
  push:
    branches: [main]
    paths: ['**.kicad_pcb', '**.glb', 'tools/export_glb.py', '.github/workflows/glb.yml']
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

# one run at a time, each on the commits before it
concurrency:
  group: glb
  cancel-in-progress: false

env:
  KICAD_VERSION: 9.0.2

jobs:
  export:
    # KiCad's macOS app on Apple silicon, as the files were first exported. KiCad's Linux image (OCCT 7.6) leaves
    # most models' colours out of a .glb; the app (OCCT 7.8) keeps them. The version is pinned: another KiCad
    # meshes the models differently, and every .glb would change.
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, to rebase onto a main that moved on
          fetch-depth: 0
      # the models the boards name under ${ERGOCAI_LIB}, at the head of main as ergogen reads it; a hidden
      # directory, which the script doesn't look in
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shiqi-614/ErgoCaiLib
          path: .ergocailib
          sparse-checkout: 3dmodels
          persist-credentials: false
      - name: KiCad
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kicad.dmg" \
            "https://github.com/KiCad/kicad-source-mirror/releases/download/$KICAD_VERSION/kicad-unified-universal-$KICAD_VERSION.dmg"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$RUNNER_TEMP/kicad" "$RUNNER_TEMP/kicad.dmg" < /dev/null > /dev/null
          app=$(find "$RUNNER_TEMP/kicad" -maxdepth 3 -name KiCad.app -type d -print -quit)
          # KiCad's own build: signed by KiCad Services Corporation
          codesign --verify --strict "$app/Contents/MacOS/kicad-cli"
          codesign -dv "$app" 2>&1 | grep -x 'TeamIdentifier=9FQDHNY6U2'
          echo "KICAD_CLI=$app/Contents/MacOS/kicad-cli" >> "$GITHUB_ENV"
          echo "KICAD_3D=$app/Contents/SharedSupport/3dmodels" >> "$GITHUB_ENV"
          "$app/Contents/MacOS/kicad-cli" version
      - name: Export
        run: python3 tools/export_glb.py --ergocai-lib .ergocailib --kicad-3d "$KICAD_3D" --kicad-cli "$KICAD_CLI" --changed "$RUNNER_TEMP/changed.txt"
      - name: Commit what changed
        run: |
          # a failing command is named on the run's page
          trap 'echo "::error::the commit step failed at: $BASH_COMMAND"' ERR
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then echo 'every .glb is up to date'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file="$RUNNER_TEMP/changed.txt"
          git commit -q -F - <<EOF
          glb: $(sed 's|.*/||' "$RUNNER_TEMP/changed.txt" | paste -sd ' ' -) exported again

          By the glb workflow (tools/export_glb.py), from ${GITHUB_SHA::7} with KiCad $KICAD_VERSION and ErgoCaiLib $(git -C .ergocailib rev-parse --short HEAD).
          EOF
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1
