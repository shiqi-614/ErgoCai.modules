# Pin capabilities of the E73-2G4M08S1C module (nRF52840, aQFN73), by module pad number.
# For whatever assigns the MCU pins (kbplacer) and writes the ZMK pin config. KicadGen puts it into the project
# next to E73-2G4M08S1C.kicad_sch; kbplacer finds it from the sheet file of the MCU footprint.
# - name: the pin name of the symbol (ErgoCaiLib nRF52840_E73-2G4M08S1C), equal to the pad's pinfunction on the
#   footprint. A free GPIO pad carries the placeholder net MCU_P<port>_<pin> of its gpio.
# - gpio, ain, nfc, xl, reset: read from that name.
#   nfc: a GPIO only once the NFCT pins are configured as GPIOs (devicetree &uicr { nfct-pins-as-gpios; }, which
#        kbplacer's zmk-config sets when it uses one; CONFIG_NFCT_PINS_AS_GPIOS=y is deprecated since Zephyr 3.7).
#        The two pins leak up to 10 uA between them while driven to different levels (PS 6.14.3, INFC_LEAK).
#   xl: the module has no 32.768 kHz crystal and ErgoCai uses the internal RC
#       (CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y), so both are plain GPIOs.
#   reset: P0.18 is the RESET pin when configured as such (&uicr { gpio-as-nreset; } when the pad is wired).
# - low_freq, recommended: the "Recommended usage" column of nRF52840 Product Specification v1.1 (4413_417),
#   Table 142 "aQFN73 ball assignments", pages 576-578.
#   low_freq: "Standard drive, low frequency I/O only", i.e. signals up to 10 kHz. Fine for a key matrix or an
#   enable line, not for an SPI clock or data line.
# - zmk: conf, the Kconfig any firmware for the module needs; kbplacer puts it into zmk-config's config/<half>.conf:
#   the low-frequency clock from the internal RC (no crystal), and BLE, which a board of ZMK's own turns on
#   but a generic one (nrf52840dk) does not; a split needs it to reach the other half.
zmk:
  conf: [CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y, CONFIG_ZMK_BLE=y]
mcu: MCU_U1
chip: nRF52840
pins:
  "1": {name: "P1.11", gpio: P1.11, low_freq: true}
  "2": {name: "P1.10", gpio: P1.10, low_freq: true}
  "3": {name: "P0.03/AIN1", gpio: P0.03, ain: 1, low_freq: true}
  "4": {name: "P0.28/AIN4", gpio: P0.28, ain: 4, low_freq: true}
  "5": {name: "GND"}
  "6": {name: "P1.13", gpio: P1.13, low_freq: true}
  "7": {name: "P0.02/AIN0", gpio: P0.02, ain: 0, low_freq: true}
  "8": {name: "P0.29/AIN5", gpio: P0.29, ain: 5, low_freq: true}
  "9": {name: "P0.31/AIN7", gpio: P0.31, ain: 7, low_freq: true}
  "10": {name: "P0.30/AIN6", gpio: P0.30, ain: 6, low_freq: true}
  "11": {name: "P0.00/XL1", gpio: P0.00, xl: 1}
  "12": {name: "P0.26", gpio: P0.26}
  "13": {name: "P0.01/XL2", gpio: P0.01, xl: 2}
  "14": {name: "P0.06", gpio: P0.06}
  "15": {name: "P0.05/AIN3", gpio: P0.05, ain: 3}
  "16": {name: "P0.08", gpio: P0.08}
  "17": {name: "P1.09", gpio: P1.09}
  "18": {name: "P0.04/AIN2", gpio: P0.04, ain: 2}
  "19": {name: "VDD"}
  "20": {name: "P0.12", gpio: P0.12}
  "21": {name: "GND"}
  "22": {name: "P0.07", gpio: P0.07}
  "23": {name: "VDDH"}
  "24": {name: "GND"}
  "25": {name: "DCCH"}
  "26": {name: "P0.18/~{RESET}", gpio: P0.18, reset: true, recommended: QSPI/CSN}
  "27": {name: "VBUS"}
  "28": {name: "P0.15", gpio: P0.15}
  "29": {name: "D-"}
  "30": {name: "P0.17", gpio: P0.17}
  "31": {name: "D+"}
  "32": {name: "P0.20", gpio: P0.20}
  "33": {name: "P0.13", gpio: P0.13}
  "34": {name: "P0.22", gpio: P0.22, recommended: QSPI}
  "35": {name: "P0.24", gpio: P0.24}
  "36": {name: "P1.00", gpio: P1.00, recommended: QSPI}
  "37": {name: "SWDIO"}
  "38": {name: "P1.02", gpio: P1.02, low_freq: true}
  "39": {name: "SWDCLK"}
  "40": {name: "P1.04", gpio: P1.04, low_freq: true}
  "41": {name: "P0.09/NFC1", gpio: P0.09, nfc: 1, low_freq: true}
  "42": {name: "P1.06", gpio: P1.06, low_freq: true}
  "43": {name: "P0.10/NFC2", gpio: P0.10, nfc: 2, low_freq: true}
